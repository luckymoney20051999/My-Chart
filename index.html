<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>My Chart</title>
<style>
html,body{margin:0;height:100%;background:#131722;color:#d1d4dc;font-family:sans-serif}
#bar{height:40px;display:flex;gap:8px;align-items:center;padding:0 8px}
#chart{height:calc(100% - 40px)}
select{background:#1e222d;color:#d1d4dc;border:1px solid #363a45;padding:4px;border-radius:4px}
</style>
<script src="https://unpkg.com/lightweight-charts@4.2.0/dist/lightweight-charts.standalone.production.js"></script>
</head>
<body>
<div id="bar">
  <select id="sym">
    <option>BTCUSDT</option>
    <option>ETHUSDT</option>
    <option>SOLUSDT</option>
  </select>
  <select id="tf">
    <option>1m</option>
    <option selected>5m</option>
    <option>15m</option>
    <option>1h</option>
    <option>4h</option>
    <option>1d</option>
  </select>
</div>
<div id="chart"></div>
<script>
const OFF = 23400; // Myanmar time +6:30

const chart = LightweightCharts.createChart(document.getElementById('chart'), {
  autoSize: true,
  layout: { background: { color: '#131722' }, textColor: '#d1d4dc' },
  grid: { vertLines: { color: '#1e222d' }, horzLines: { color: '#1e222d' } },
  timeScale: { timeVisible: true, secondsVisible: false }
});

const candleS = chart.addCandlestickSeries({
  upColor: '#26a69a', downColor: '#ef5350',
  borderVisible: false, wickUpColor: '#26a69a', wickDownColor: '#ef5350'
});
const e20 = chart.addLineSeries({ color: '#2962ff', lineWidth: 1, priceLineVisible: false });
const e50 = chart.addLineSeries({ color: '#ff9800', lineWidth: 1, priceLineVisible: false });
const e200 = chart.addLineSeries({ color: '#e91e63', lineWidth: 2, priceLineVisible: false });
const stS = chart.addLineSeries({ lineWidth: 2, priceLineVisible: false });

function ema(c, p) {
  const k = 2 / (p + 1);
  let e = null;
  return c.map(x => {
    e = e === null ? x.close : x.close * k + e * (1 - k);
    return { time: x.time, value: e };
  });
}

function supertrend(c, p = 10, m = 3) {
  const out = [];
  let atr = 0, fu = 0, fl = 0, dir = 1;
  for (let i = 0; i < c.length; i++) {
    const x = c[i];
    const pc = i ? c[i - 1].close : x.close;
    const tr = i ? Math.max(x.high - x.low, Math.abs(x.high - pc), Math.abs(x.low - pc)) : x.high - x.low;
    atr = i < p ? (i ? (atr * i + tr) / (i + 1) : tr) : (atr * (p - 1) + tr) / p;
    const hl2 = (x.high + x.low) / 2;
    let u = hl2 + m * atr;
    let l = hl2 - m * atr;
    if (i) {
      u = (u < fu || pc > fu) ? u : fu;
      l = (l > fl || pc < fl) ? l : fl;
      if (dir === 1 && x.close < l) dir = -1;
      else if (dir === -1 && x.close > u) dir = 1;
    }
    fu = u; fl = l;
    out.push({
      time: x.time,
      value: dir === 1 ? l : u,
      color: dir === 1 ? '#26a69a' : '#ef5350'
    });
  }
  return out;
}

let candles = [];
let ws = null;

function draw() {
  e20.setData(ema(candles, 20));
  e50.setData(ema(candles, 50));
  e200.setData(ema(candles, 200));
  stS.setData(supertrend(candles));
}

async function load() {
  if (ws) ws.close();
  const s = document.getElementById('sym').value;
  const t = document.getElementById('tf').value;
  try {
    const r = await fetch('https://fapi.binance.com/fapi/v1/klines?symbol=' + s + '&interval=' + t + '&limit=1000');
    const d = await r.json();
    candles = d.map(k => ({
      time: k[0] / 1000 + OFF,
      open: +k[1], high: +k[2], low: +k[3], close: +k[4]
    }));
    candleS.setData(candles);
    draw();
    chart.timeScale().fitContent();
  } catch (e) {
    alert('Data load error: ' + e.message);
    return;
  }
  ws = new WebSocket('wss://fstream.binance.com/ws/' + s.toLowerCase() + '@kline_' + t);
  ws.onmessage = ev => {
    const k = JSON.parse(ev.data).k;
    const c = {
      time: k.t / 1000 + OFF,
      open: +k.o, high: +k.h, low: +k.l, close: +k.c
    };
    const last = candles[candles.length - 1];
    if (c.time === last.time) candles[candles.length - 1] = c;
    else candles.push(c);
    candleS.update(c);
    draw();
  };
}

document.getElementById('sym').onchange = load;
document.getElementById('tf').onchange = load;
load();
</script>
</body>
  </html>
